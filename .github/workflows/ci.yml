name: Validate GNTC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Gntc.sln --configuration Release
      - run: dotnet test Gntc.sln --configuration Release --no-build
      - run: dotnet run --project src/Gntc.Cli --configuration Release --no-build -- validate data/1tim.gntc --source data/source/75-1Ti-morphgnt.txt

  schemas-and-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: python -m pip install -r scripts/requirements.txt
      - run: dotnet run --project src/Gntc.Cli --configuration Release -- build .
      - run: python scripts/validate_json.py
      - run: xmllint --noout --relaxng schemas/tei_all-4.12.0.rng data/1tim.tei.xml examples/1tim-4.7-8.tei.xml
      - run: python scripts/benchmark_tokens.py --check
      - run: git diff --exit-code -- data examples profiles
